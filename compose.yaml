services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-core-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus_core_lab
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_core_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
