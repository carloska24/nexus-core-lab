name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_ci
          POSTGRES_DB: nexus_core_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_core_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://nexus:nexus_ci@localhost:5432/nexus_core_lab?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply PostgreSQL migrations
        run: go run ./cmd/migrate -url "$TEST_DATABASE_URL" -up

      - name: Check backend formatting
        run: |
          unformatted="$(find . -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted"

      - name: Vet backend
        run: go vet ./...

      - name: Test backend
        run: go test -count=1 ./...

      - name: Race detector
        run: go test -race -count=1 ./...

      - name: Build backend
        run: go build ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/reference-version/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/reference-version
        run: npm ci

      - name: Test map presentation
        working-directory: web/reference-version
        run: npm run test:map

      - name: Build frontend
        working-directory: web/reference-version
        run: npm run build

      - name: Build production container
        run: docker build --tag nexus-core-lab:ci .
